name: Build 2Dhive APK

# Signing: without any setup the APK is signed with the runner's throw-away debug key, so every build
# has a different signature (Android then refuses to update over an older build, and Aniyomi asks to
# trust the extension again). For a stable signature add these repository secrets
# (Settings > Secrets and variables > Actions):
#   TWODHIVE_SIGNING_KEY             base64 of a keystore:  base64 -w0 signingkey.jks
#   TWODHIVE_KEY_STORE_PASSWORD      keystore password
#   TWODHIVE_KEY_ALIAS               key alias
#   TWODHIVE_KEY_PASSWORD            key password
# e.g.  keytool -genkeypair -v -keystore signingkey.jks -alias twodhive -keyalg RSA -keysize 2048 -validity 36500
# The repository's standard secret names (SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD, as used by
# build_push.yml) work as well. The repository's build logic then signs with the key (it uses a root
# signingkey.jks, which is git-ignored).

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - arena/df6a4602-anime-extensions
    paths:
      - "src/en/twodhive/**"
      - ".github/workflows/build-twodhive-apk.yml"
      - "gradle/build-logic/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: build-twodhive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 2Dhive release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishes the APK as a pre-release
      checks: write # publishes the build report as a check run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # The repository's own formatting gate (ktlint through Spotless). It only reports here,
      # so that a formatting nit can never stop the APK from being built.
      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :src:en:twodhive:spotlessCheck --console=plain 2>&1 | tee format.log
          exit "${PIPESTATUS[0]}"

      - name: Build 2Dhive
        id: build
        continue-on-error: true
        env:
          CI: "false" # Spotless formats instead of failing, see the step above
          # Optional stable signing key, see the comment at the top. All empty when the secrets are not set.
          SIGNING_KEY_BASE64: ${{ secrets.TWODHIVE_SIGNING_KEY || secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.TWODHIVE_KEY_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.TWODHIVE_KEY_ALIAS || secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.TWODHIVE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            (umask 077 && printf '%s' "$SIGNING_KEY_BASE64" | base64 -d > signingkey.jks)
            echo "mode=custom" >> "$GITHUB_OUTPUT"
            echo "signing: repository key from the signing secrets"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "signing: runner debug key (no signing secrets set)"
          fi
          ./gradlew :src:en:twodhive:assembleRelease --console=plain --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Inspect APK
        id: apk
        if: steps.build.outcome == 'success'
        run: |
          APK=$(ls src/en/twodhive/build/outputs/apk/release/*.apk | head -n 1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK" > badging.txt || true
          VERSION=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "== file"
            ls -l "$APK"
            echo
            echo "== aapt2 dump badging"
            grep -E "^(package|sdkVersion|targetSdkVersion|application-label)|uses-permission|meta-data|activity" badging.txt || true
            echo
            echo "== apksigner verify"
            "$APKSIGNER" verify --print-certs "$APK" || true
            echo
            echo "== merged manifest (feature, meta-data, activities, deep links)"
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | grep -E "E: (uses-feature|meta-data|activity|data)|A: .*(name|value|host|scheme|path)" || true
            echo
            echo "== classes of the extension in classes.dex (R8 must keep TwoDHive with its name)"
            DEXDUMP=$(ls "$ANDROID_HOME"/build-tools/*/dexdump | sort -V | tail -n 1)
            unzip -p "$APK" classes.dex > classes.dex || true
            "$DEXDUMP" classes.dex | grep "Class descriptor" | grep "animeextension/en/twodhive/" || true
            echo
            echo "== apk contents"
            unzip -l "$APK"
          } > apk-info.txt 2>&1
          cat apk-info.txt
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          echo "signer=$SIGNER" >> "$GITHUB_OUTPUT"

      - name: Publish build report
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SIGNING_MODE: ${{ steps.build.outputs.mode }}
          SIGNER: ${{ steps.apk.outputs.signer }}
        run: |
          {
            echo "# 2Dhive build"
            echo "commit: $GITHUB_SHA"
            echo "format check: $FORMAT_OUTCOME"
            echo "build: $BUILD_OUTCOME"
            echo "signing: ${SIGNING_MODE:-unknown} (signer SHA-256: ${SIGNER:-n/a})"
            echo
            echo "## Problem lines"
            { cat format.log build.log 2>/dev/null || true; } | grep -nE "^e: |^w: .*twodhive|error:|FAILED|What went wrong|Execution failed|Caused by|ERROR:|format violations" | cut -c1-600 | head -n 150
            echo
            echo "## Formatting check"
            head -c 40000 format.log 2>/dev/null || true
            echo
            echo "## APK"
            cat apk-info.txt 2>/dev/null | head -n 220 || true
          } > report-1.txt
          {
            echo "## Gradle build log (tail)"
            tail -c 52000 build.log 2>/dev/null || echo "(no build log)"
          } > report-2.txt
          i=0
          for f in report-1.txt report-2.txt; do
            i=$((i + 1))
            jq -n \
              --arg name "twodhive-report-$i" \
              --arg sha "$GITHUB_SHA" \
              --arg title "2Dhive build report $i (build: $BUILD_OUTCOME)" \
              --rawfile text <(head -c 60000 "$f") \
              '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: $title, summary: "Build diagnostics", text: $text}}' |
              gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent || echo "could not publish report $i"
          done

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twodhive-release-apk
          path: src/en/twodhive/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twodhive-build-logs
          path: |
            build.log
            format.log
            apk-info.txt
          if-no-files-found: ignore
          retention-days: 7

      # The APK is also kept in the repository, so that it can be fetched with a plain `git fetch`
      # and without an account that is allowed to read the workflow's artifacts.
      - name: Publish the APK in the repository
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          mkdir -p releases
          cp "$APK_PATH" "releases/tachiyomi-en.twodhive-v${VERSION}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases
          git commit -m "chore(releases): the 2Dhive APK of ${GITHUB_SHA::7}" || echo "nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

      # A pre-release is far easier to install from a phone than a zipped Actions artifact,
      # and it does not expire. The tag follows the branch, so only the latest build is kept.
      - name: Publish pre-release
        if: steps.build.outcome == 'success' && github.ref_type == 'branch'
        continue-on-error: true
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          SIGNING_MODE: ${{ steps.build.outputs.mode }}
          SIGNER: ${{ steps.apk.outputs.signer }}
        run: |
          TAG="twodhive-ci-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          NAME="tachiyomi-en.twodhive-v${VERSION}.apk"
          if [ "$SIGNING_MODE" = "custom" ]; then
            SIGNING="Signed with the repository's own key, so later builds update this one in place."
          else
            SIGNING="Signed with the CI runner's throw-away debug key: every build has a different signature, so uninstall an older build before installing a newer one (add the TWODHIVE_* secrets for a stable key, see the workflow file)."
          fi
          cp "$APK_PATH" "$NAME"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$NAME" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "2Dhive $VERSION (CI build of ${GITHUB_SHA::7})" \
            --notes "2Dhive extension (extension lib 16) built from \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA::7}\`. Install it in Aniyomi / Anikku via Settings > Browse > Extensions > Install from file (or open the APK), then trust the extension when asked. $SIGNING Signer SHA-256: \`${SIGNER:-n/a}\`."
          echo "Published: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail the job when the build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "The 2Dhive build failed, see the build report check runs and the twodhive-build-logs artifact."
          exit 1
