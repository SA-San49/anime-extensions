name: Build AnimeAlpha APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - arena/c195dace-anime-extensions
    paths:
      - "src/en/animealpha/**"
      - ".github/workflows/build-animealpha-apk.yml"
      - "gradle/build-logic/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"

permissions:
  contents: read

concurrency:
  group: build-animealpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AnimeAlpha release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishes the APK as a pre-release
      checks: write # publishes the build report as a check run
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      # The repository's own formatting gate (ktlint through Spotless). It only reports here,
      # so that a formatting nit can never stop the APK from being built.
      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :src:en:animealpha:spotlessCheck --console=plain 2>&1 | tee format.log
          exit "${PIPESTATUS[0]}"

      - name: Build AnimeAlpha
        id: build
        continue-on-error: true
        env:
          CI: "false" # Spotless formats instead of failing, see the step above
        run: |
          set -o pipefail
          ./gradlew :src:en:animealpha:assembleRelease --console=plain --stacktrace 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Inspect APK
        id: apk
        if: steps.build.outcome == 'success'
        run: |
          APK=$(ls src/en/animealpha/build/outputs/apk/release/*.apk | head -n 1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK" > badging.txt || true
          VERSION=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" badging.txt | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "== file"
            ls -l "$APK"
            echo
            echo "== aapt2 dump badging"
            grep -E "^(package|sdkVersion|targetSdkVersion|application-label)|uses-permission|meta-data|activity" badging.txt || true
            echo
            echo "== apksigner verify"
            "$APKSIGNER" verify --print-certs "$APK" || true
            echo
            echo "== apk contents"
            unzip -l "$APK"
          } > apk-info.txt 2>&1
          cat apk-info.txt

      - name: Publish build report
        if: always()
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "# AnimeAlpha build"
            echo "commit: $GITHUB_SHA"
            echo "format check: $FORMAT_OUTCOME"
            echo "build: $BUILD_OUTCOME"
            echo
            echo "## Problem lines"
            { cat format.log build.log 2>/dev/null || true; } | grep -nE "^e: |^w: .*animealpha|error:|FAILED|What went wrong|Execution failed|Caused by|ERROR:|format violations" | cut -c1-600 | head -n 150
            echo
            echo "## Formatting check (tail)"
            tail -n 40 format.log 2>/dev/null || true
            echo
            echo "## APK"
            cat apk-info.txt 2>/dev/null | head -n 120 || true
          } > report-1.txt
          {
            echo "## Gradle build log (tail)"
            tail -c 52000 build.log 2>/dev/null || echo "(no build log)"
          } > report-2.txt
          i=0
          for f in report-1.txt report-2.txt; do
            i=$((i + 1))
            jq -n \
              --arg name "animealpha-report-$i" \
              --arg sha "$GITHUB_SHA" \
              --arg title "AnimeAlpha build report $i (build: $BUILD_OUTCOME)" \
              --rawfile text <(head -c 60000 "$f") \
              '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: $title, summary: "Build diagnostics", text: $text}}' |
              gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent || echo "could not publish report $i"
          done

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: animealpha-release-apk
          path: src/en/animealpha/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: animealpha-build-logs
          path: |
            build.log
            format.log
            apk-info.txt
          if-no-files-found: ignore
          retention-days: 7

      # A pre-release is far easier to install from a phone than a zipped Actions artifact,
      # and it does not expire. The tag follows the branch, so only the latest build is kept.
      - name: Publish pre-release
        if: steps.build.outcome == 'success' && github.ref_type == 'branch'
        continue-on-error: true
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          TAG="animealpha-ci-${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          NAME="tachiyomi-en.animealpha-v${VERSION}.apk"
          cp "$APK_PATH" "$NAME"
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$NAME" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AnimeAlpha $VERSION (CI build of ${GITHUB_SHA::7})" \
            --notes "Debug-signed build of the AnimeAlpha extension (extension lib 16) from \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA::7}\`. Install it in Aniyomi / Anikku via Settings > Browse > Extensions > Install from file (or open the APK), then trust the extension when asked."
          echo "Published: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail the job when the build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "The AnimeAlpha build failed, see the build report check runs and the animealpha-build-logs artifact."
          exit 1
