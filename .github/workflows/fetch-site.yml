name: Fetch Site (analysis relay)

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Newline-separated URL paths (e.g. / or /anime?letter=all)"
        required: true
        type: string
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/fetch-site.yml"
      - ".fetch-paths.txt"
      - ".fetch-relay.py"

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch all paths (with Anubis solver)
        env:
          INPUT_PATHS: ${{ inputs.paths || '' }}
        run: |
          if [ -n "$INPUT_PATHS" ]; then
            PATHS="$INPUT_PATHS"
          else
            PATHS=$(cat .fetch-paths.txt)
          fi
          mkdir -p out
          # shellcheck disable=SC2086
          python3 .fetch-relay.py out $PATHS
          grep -oE '(src|href)="[^"]+\.(js|mjs|css)[^"]*"' out/* 2>/dev/null | sort -u | head -200 > out/_assets.txt || true

      - name: Commit fetched pages to fetch-relay branch
        run: |
          cd out
          git init -q .
          git checkout -q -b fetch-relay
          git config user.name "fetch-relay"
          git config user.email "relay@users.noreply.github.com"
          git add -A
          git commit -q -m "fetch: ${{ github.run_id }}" || exit 0
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fetch-relay --force
